services:
  - type: web
    name: vvgu-schedule-bot
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: SPREADSHEET_ID
        value: 1rg2JJr3QK_mPcB1SP96HZ64EDSf7oup1xYAEpfwUcN8
      - key: CACHE_TTL_SECONDS
        value: "1800"